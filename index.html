<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salone">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>Salone Maria Orocorvino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F9F8; --surface:#FFFFFF; --ink:#1E2B24; --ink2:#56645C; --ink3:#7D8A83;
  --line:#E3E9E5; --line2:#EEF2EF; --gold:#4F7D66; --gold-d:#3B624F; --gold-soft:#E6F0EA;
  --danger:#B4483A; --danger-soft:#FBEFEA; --ok:#4F7D66; --ok-soft:#E6F0EA;
  --closed:#F1F3F6; --closed-ink:#5B6B85; --closed-chip:#E3E8F0;
  --serif: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r:16px; --nav:88px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* NAV */
.nav{width:var(--nav);flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:18px 0 12px;gap:6px}
.brand{width:46px;height:46px;border-radius:50%;background:var(--gold-soft);color:var(--gold-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;margin-bottom:14px;flex:none}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;width:70px;border-radius:14px;font-size:12px;font-weight:600;color:var(--ink3);min-height:64px;justify-content:center}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:var(--gold-soft);color:var(--gold-d)}
.nav .spacer{flex:1}
.nav .badge{position:absolute;top:6px;right:12px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}
.nav button{position:relative}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 22px 12px;background:var(--bg);flex-wrap:wrap}
.topbar h1{font-weight:700;font-size:26px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.topbar .sub{color:var(--ink2);font-size:14px}
.grow{flex:1}
.proto{display:flex;align-items:center;gap:10px;background:#FFF8E8;color:#7A5B12;font-size:12.5px;padding:6px 22px;border-bottom:1px solid #F1E4C4}
.proto button{text-decoration:underline;color:#7A5B12;font-size:12.5px}
.content{flex:1;overflow:auto;padding:0 22px 22px;-webkit-overflow-scrolling:touch}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px;white-space:nowrap}
.btn.primary{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{color:var(--danger);border-color:#EBCFCA;background:#fff}
.btn.ghost{background:transparent;border-color:transparent}
a.btn{color:var(--ink)}
.btn.sm{height:36px;padding:0 13px;font-size:14px;border-radius:18px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.iconbtn{width:44px;height:44px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;background:var(--line2);border-radius:22px;padding:3px}
.seg button{height:38px;padding:0 16px;border-radius:19px;font-weight:600;font-size:14.5px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.input{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;width:100%;font-size:17px;outline:none}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
textarea.input{height:auto;min-height:80px;padding:12px 14px;resize:vertical;line-height:1.4}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;font-size:13px;font-weight:600;background:var(--line2);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.gold{background:var(--gold-soft);color:var(--gold-d)}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.empty{padding:40px 20px;text-align:center;color:var(--ink3)}

/* AGENDA */
.agenda-wrap{display:flex;gap:18px;height:100%;min-height:0}
.cal{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.cal-head{display:flex;border-bottom:1px solid var(--line);background:#fff;flex:none}
.cal-head .tc{width:54px;flex:none}
.cal-head .dh{flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-left:1px solid var(--line2);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink2)}
.cal-head .dh .dd{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:14px;font-weight:700;color:var(--ink)}
.cal-head .dh.today .dd{background:var(--gold);color:#fff}
.cal-head .dh.closed{background:var(--closed)}
.agenda-wrap:has(.dpanel) .cbadge{display:none}
.cbadge{font-size:10.5px;font-weight:700;color:var(--closed-ink);background:var(--closed-chip);border-radius:8px;padding:2px 6px;text-transform:uppercase;letter-spacing:.04em}
.cal-body{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.cal-grid{display:flex;position:relative}
.times{width:54px;flex:none;position:relative}
.times div{position:absolute;right:10px;font-size:12px;color:var(--ink3);transform:translateY(-7px);font-variant-numeric:tabular-nums}
.daycol{flex:1 1 0;min-width:0;position:relative;border-left:1px solid var(--line2);cursor:copy}
.daycol.closed{background-color:var(--closed)}
.daycol.today{background-color:#FBFDFC}
.offh{position:absolute;left:0;right:0;background:rgba(91,107,133,.075);pointer-events:none}
.mgrid{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mhead{display:grid;grid-template-columns:var(--mcols,repeat(7,minmax(0,1fr)));font-size:11px;font-weight:700;color:var(--ink3);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:var(--mcols,repeat(7,minmax(0,1fr)));border-bottom:1px solid var(--line2)}
.mrow:last-child{border-bottom:0}
.mcell{min-height:92px;padding:4px 2px;display:flex;flex-direction:column;gap:2px;align-items:stretch;border-left:1px solid var(--line2);text-align:left;min-width:0}
.mcell:first-child{border-left:0}
.mcell.closed{background:var(--closed)}
.mcell.out{opacity:.35}
.mnum{align-self:center;font-weight:600;font-size:14px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:13px;margin-bottom:1px}
.mcell.today .mnum{background:var(--gold);color:#fff}
.mchip{font-size:10px;font-weight:600;border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmore{font-size:10px;color:var(--ink3);padding-left:3px}
.fab-today{display:none;position:fixed;left:14px;bottom:calc(76px + env(safe-area-inset-bottom));height:40px;padding:0 18px;border-radius:20px;background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 4px 14px rgba(30,43,36,.12);font-weight:700;z-index:20;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.prow1,.prow2{display:flex;align-items:center;gap:8px;width:100%}
.pback{display:inline-flex;align-items:center;gap:2px;color:var(--gold);font-weight:600;font-size:16px;height:40px}
.pic{width:36px!important;height:36px!important}
.ptoday{height:36px!important;padding:0 12px!important}
.ptitle{font-size:18px!important;margin:0 2px;white-space:nowrap}
@media (max-width:400px){.ptitle .muted{display:none}}
.pcal-h{flex:none;height:24px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line)}
.pback svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.pplus{background:var(--gold)!important;color:#fff;border-color:var(--gold)!important}
.pweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:100%;margin-top:2px}
.pday{display:flex;flex-direction:column;align-items:center;gap:1px;padding:0;border-radius:12px;min-height:44px}
.pday small{font-size:10px;font-weight:700;color:var(--ink3)}
.pday b{font-size:15px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:17px}
.pday i{width:3px;height:3px;border-radius:2px;background:var(--ink3)}
.pday.closed b{color:var(--closed-ink);background:var(--closed)}
.pday.today b{color:var(--gold)}
.pday.on b{background:var(--ink);color:#fff}
.pday.on.today b{background:var(--gold);color:#fff}
.pdate{width:100%;text-align:center;font-size:14px;font-weight:600;color:var(--ink2);padding:4px 0 2px;display:flex;justify-content:center;gap:6px;align-items:center}
.pcal{border-radius:14px}
.pcal .cal-body{max-height:none}
.ev{position:absolute;left:3px;right:3px;border-radius:10px;padding:5px 9px;overflow:hidden;font-size:13px;line-height:1.25;cursor:pointer;box-sizing:border-box}
.ev .t{font-size:11.5px;font-weight:500;opacity:.78;font-variant-numeric:tabular-nums}
.ev .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;font-size:12px}
.ev.paid{opacity:.62}
.ev.paid::after{content:"";position:absolute;top:7px;right:8px;width:9px;height:5px;border-left:2.4px solid var(--gold);border-bottom:2.4px solid var(--gold);transform:rotate(-45deg)}
.ev.noshow{opacity:.4;text-decoration:line-through}
.ev.sel{box-shadow:0 0 0 2.5px var(--gold);opacity:1;z-index:2}
.ev.block{background:#F2F5F3;border:1.5px dashed #C9D3CD;color:var(--ink2)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--gold);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.strip-l{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-right:2px}
.schip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.schip b{color:var(--ink);font-size:14.5px}
.schip.warn{background:var(--danger-soft);border-color:#F2D9CF;color:#8E3A20}.schip.warn b{color:#8E3A20}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--closed);border:1px solid #DCE2EA}
.dpanel{width:296px;flex:none;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.dpanel .dhead{display:flex;align-items:center;gap:10px}
.dpanel .dname{font-size:17px;font-weight:700}
.dinfo{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.dinfo div{display:flex;gap:8px}.dinfo span:first-child{width:64px;flex:none;color:var(--ink3)}
.dfoot{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;border-top:1px solid var(--line);padding-top:10px}
.daylist{display:flex;flex-direction:column;gap:8px}
.wlist{display:flex;flex-direction:column;gap:8px}
.wday{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 10px 8px}
.wday.closed{background:var(--closed)}
.wday.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.wday-h{display:flex;align-items:center;gap:8px;min-height:36px}
.wday-t{font-size:14px;font-weight:600;color:var(--ink2)}
.wday-t b{color:var(--ink);font-size:15px}
.wday.today .wday-t b{color:var(--gold)}
.wrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 2px;border-top:1px solid var(--line2);font-size:13px}
.wrow .wt{width:40px;flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.wrow .wd{width:8px;height:8px;border-radius:50%;flex:none}
.wrow .wn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow.paid{opacity:.6}.wrow.noshow{opacity:.4;text-decoration:line-through}
.wok{color:var(--gold);font-weight:800}
.wstrip{display:flex;gap:6px;margin-bottom:12px}
.wstrip button{flex:1;border-radius:14px;padding:7px 0;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;font-weight:600}
.wstrip button small{font-size:11px;color:var(--ink3);text-transform:uppercase}
.wstrip button b{font-size:18px}
.wstrip button.on{background:var(--gold);border-color:var(--gold);color:#fff}.wstrip button.on small{color:#E6F0EA}
.wstrip button.closed{background:var(--closed)}
.lcard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.lcard .bar{width:6px;align-self:stretch;border-radius:3px}
.lfree{display:flex;align-items:center;gap:8px;height:44px;border:1.5px dashed #C9D3CD;border-radius:12px;padding:0 14px;color:var(--gold);font-weight:600;font-size:14px;background:transparent;width:100%}
.ltime{width:48px;font-weight:700;font-size:15px;text-align:right;flex:none}
.side{width:300px;flex:none;display:flex;flex-direction:column;gap:14px;overflow:auto}
.side .card{padding:16px}
.kpi{display:flex;gap:10px}
.kpi>div{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px}
.kpi .v{font-size:24px;font-weight:600}
.kpi .l{font-size:12px;color:var(--ink2)}
.alist{display:flex;flex-direction:column}
.aitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2);cursor:pointer}
.aitem:first-child{border-top:0}
.aitem .tm{font-variant-numeric:tabular-nums;font-weight:700;width:46px;font-size:14px}
.aitem .dot{width:10px;height:10px;border-radius:50%;flex:none}
.aitem .who{flex:1;min-width:0}
.aitem .who div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitem .who div:last-child{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sectitle{font-size:18px;font-weight:600;margin:0 0 10px}

/* SHEET */
.overlay{position:fixed;inset:0;background:rgba(28,25,22,.38);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.sheet{background:var(--bg);border-radius:20px;width:min(620px,100%);max-height:calc(100dvh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff}
.sheet-h h2{font-size:21px;font-weight:600;margin:0;flex:1;text-align:center}
.sheet-b{padding:18px 20px;overflow:auto;flex:1}
.sheet-f{padding:12px 16px;border-top:1px solid var(--line);background:#fff;display:flex;gap:10px;align-items:center}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.svc{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.svc .sn{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.svc .sm{font-size:13px;color:var(--ink2)}
.svc.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-d);box-shadow:inset 0 0 0 1px var(--gold)}
.svc.on .sm{color:var(--gold-d)}
.sugg{border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:6px;overflow:hidden}
.sugg button{display:flex;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line2);gap:10px;align-items:center}
.sugg button:first-child{border-top:0}
.sel-client{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--gold-soft);color:var(--gold-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;height:48px}
.stepper button{width:48px;height:46px;font-size:22px;font-weight:600}
.stepper span{min-width:70px;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.payline{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.payline:first-child{border-top:0}
.payline .pl{flex:1}
.payline input{width:100px;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:26px;font-weight:700;padding-top:12px;border-top:2px solid var(--line);margin-top:6px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.methods button{height:52px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600}
.methods button.on{border-color:var(--gold);background:var(--gold);color:#fff}
.det-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line2)}
.det-row:first-child{border-top:0}
.det-row .k{width:110px;color:var(--ink2);font-size:14px;padding-top:1px}
.det-row .v{flex:1;font-weight:500}

/* CLIENTI */
.split{display:flex;gap:18px;height:100%;min-height:0}
.list-pane{width:360px;flex:none;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list-pane .search{padding:12px;border-bottom:1px solid var(--line)}
.list-scroll{flex:1;overflow:auto}
.litem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer;width:100%;text-align:left}
.litem.on{background:var(--gold-soft)}
.litem .ln{font-weight:600}
.litem .ls{font-size:13px;color:var(--ink2)}
.detail-pane{flex:1;min-width:0;overflow:auto}
.detail-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.detail-head .avatar{width:64px;height:64px;font-size:24px}
.detail-head h2{font-size:28px;margin:0;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}

.prow .pb{font-size:13px;color:var(--ink2)}

.stock small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--ink3);font-weight:500}
.pacts{display:flex;gap:6px;justify-content:flex-end}

/* INCASSI */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}

.kcard .d{font-size:13px;margin-top:2px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.two.half{grid-template-columns:1fr 1fr}
.detail-head .acts{display:flex;gap:8px;flex-wrap:wrap}
.bar-row{display:flex;align-items:center;gap:10px;margin:9px 0}
.bar-row .bl{width:150px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .bt{flex:1;height:12px;background:var(--line2);border-radius:6px;overflow:hidden}
.bar-row .bt div{height:100%;border-radius:6px}
.bar-row .bv{width:70px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}

/* LISTINO */
.svc-row{display:grid;grid-template-columns:28px minmax(0,1fr) 150px 130px 44px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line2)}
.svc-row:first-child{border-top:0}
.cdot{width:20px;height:20px;border-radius:50%;border:3px solid}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--gold-d);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none;font-size:15px}
.toast.show{opacity:1;transform:translateX(-50%)}

.stepper.big{height:56px}.stepper.big button{width:56px;height:54px;font-size:24px}.stepper.big span{min-width:60px;font-size:22px}
.seg.full{display:flex}.seg.full button{flex:1}
.bchart{display:flex;gap:2px;align-items:flex-end;height:180px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bcol span{font-size:10.5px;color:var(--ink3);white-space:nowrap;height:14px}
.bbar{width:70%;border-radius:4px 4px 0 0;background:#A9C3B5;min-height:0}
.bbar.cur{background:var(--gold)}
.bcol.cl .bbar{background:var(--line2)}
.two>*{min-width:0}
.set-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.set-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.set-card{padding:16px}
.set-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line2)}
.set-day{width:88px;font-weight:600}
.input.sm{height:38px;font-size:14.5px;padding:0 8px;width:auto}
.pin-dots{display:flex;gap:6px}.pin-dots i{width:12px;height:12px;border-radius:6px;background:var(--ink)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center}
#lock.show{display:flex}
.lock-box{text-align:center;width:280px}
.lock-t{font-size:20px;font-weight:700;margin-bottom:16px}
.lock-dots{display:flex;gap:14px;justify-content:center;margin-bottom:8px}
.lock-dots i{width:16px;height:16px;border-radius:8px;border:2px solid var(--gold)}
.lock-dots i.on{background:var(--gold)}
.lock-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lock-err{font-size:13px;color:var(--ink3);height:20px;margin-bottom:10px}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.keypad button{width:72px;height:72px;border-radius:36px;background:#fff;border:1px solid var(--line);font-size:26px;font-weight:600}
.keypad span{display:block}
@media (max-width: 1100px) and (min-width:761px){
  .mgrow{grid-template-columns:minmax(0,1fr) 120px 104px 80px 100px 92px}
  .mgrow .c-sec{display:none}
  .set-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 760px) and (min-height: 501px){
  .na-grid{grid-template-columns:1fr}
  .sl-body{max-height:300px}
  .na-foot{gap:10px}
  .half{grid-template-columns:1fr;height:auto}
  .half .list-pane{max-height:none}
  .cd-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cd .row{flex-wrap:wrap}
  .mgrow{grid-template-columns:minmax(0,1fr) 70px 92px;row-gap:4px}
  .mgrow.hd{display:none}
  .mgrow .c-sec,.mgrow .c-acq,.mgrow .c-mrg{display:none}
  .mgrow>div:nth-child(5){display:none}
  .mgrow .pm{grid-column:3;grid-row:1}
  .mgrow>div:nth-child(3){grid-column:1 / span 2}
  .set-grid{grid-template-columns:1fr}
  .mg-bar .search-in{width:100%!important}
  .fchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .tech-grid{grid-template-columns:1fr 1fr 1fr}
  .li-row{grid-template-columns:minmax(0,1fr) 54px 50px}
  .li-c{display:none}
  .nav button{font-size:9.5px!important}
}
@media (max-height: 500px){
  .na-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .sl-body{max-height:200px}
}

/* ---- polish v1.1 ---- */
.bcol span,.bcol small{font-size:11.5px}
.two{align-items:start}
.ev .t,.ev .n,.ev .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-n{overflow-wrap:anywhere}
.set-day{width:100px;flex-shrink:0}
.set-row .input.sm{min-width:0}
.mg-show button{min-height:34px;padding:0 12px}
.only-stack{display:none!important}
body.stack .only-stack{display:inline-flex!important}
body.stack .topbar .search-in:has(#clq){display:none!important}
body.stack .list-pane.hide-m,body.stack .detail-pane.hide-m,body.stack .hide-m{display:none!important}
body.stack .half{grid-template-columns:1fr;height:auto}
body.stack .half .list-pane{max-height:none}
@media (min-width:761px) and (max-width:899px) and (min-height:501px){
  .topbar .btn.primary>span,.topbar .newbtn>span{display:none}
  .topbar .btn.primary,.topbar .newbtn{width:44px;padding:0;justify-content:center}
  .topbar .search-in{width:220px!important}
  .two{grid-template-columns:1fr}
  .inc-two>:first-child{order:2}
  .mgrow{grid-template-columns:minmax(0,1fr) 110px 78px 100px 92px}
  .mgrow .c-acq,.mgrow .c-sec{display:none}
  .cal-head .cbadge{display:none}
  .cal-head .dh{font-size:12.5px;gap:4px}
  .set-grid{grid-template-columns:1fr}
}
@media (max-width: 760px) and (min-height: 501px){
  .nav button{font-size:11px!important}
  .wstrip button small{font-size:11px}
  .sheet-h h2{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet-h{padding:12px 12px}
  .ps-form .row:not(.keep){flex-direction:column;align-items:stretch!important}
  .ps-form .row .field{max-width:none!important}
  .ps-form .seg.full button{padding:0 6px;font-size:13.5px}
  .schip{height:32px}
}
@media (max-height: 500px){
  .topbar .btn.primary>span{display:none}
  .topbar .btn.primary{width:34px;padding:0;justify-content:center}
  .topbar .search-in{width:200px!important;height:34px}
  .fchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
  .fchip{height:30px;font-size:13px}
  .half{height:auto}
  .half .list-scroll{max-height:none;overflow:visible}
  .mg-show{margin-bottom:6px}
  .nav button{font-size:11px}
  .cd-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---- giorni di chiusura in settimana (v1.2) ---- */
.cal-head .dh.slim,.daycol.slim{flex:0 0 34px}
.cal-head .dh.slim{flex-direction:column;gap:0;cursor:pointer;line-height:1.1;font-size:12px;color:var(--ink3)}
.cal-head .dh.slim .sl{font-weight:700}.cal-head .dh.slim .sn{font-weight:600}
.daycol.slim{cursor:pointer;background:repeating-linear-gradient(135deg,var(--closed) 0 8px,#E7ECE9 8px 9px)}
.daycol.slim .slimlbl{position:sticky;top:40%;margin-top:120px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);text-align:center;width:100%}
.daycol.slim:hover{background:#E9EEEB}
.wkcol{border:0;background:transparent;width:26px;height:26px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink3);margin-left:2px}
.wkcol svg{width:16px;height:16px}
.wktoggle{height:34px;padding:0 14px;border-radius:17px;border:1px dashed #B8C4BD;background:#fff;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.wktoggle.on{border-style:solid;background:var(--closed);color:var(--ink)}
.cal.hscroll{position:relative;--cw:120px}
.cal.hscroll .cal-head{overflow:hidden}
.cal.hscroll .cal-head .dh{flex:0 0 var(--cw)}
.cal.hscroll .cal-head .tc{position:sticky;left:0;background:#fff;z-index:2}
.cal.hscroll .cal-body{overflow:auto;overscroll-behavior-x:contain}
.cal.hscroll .cal-grid{width:max-content}
.cal.hscroll .daycol{flex:0 0 var(--cw)}
.cal.hscroll .cal-grid::after{content:'';flex:0 0 22px}
.cal.hscroll .cal-head::after{content:'';flex:0 0 22px}
.cal.hscroll .times{position:sticky;left:0;z-index:3;background:#fff;scroll-snap-align:none}
.cal.hscroll .cal-head{padding-right:0}
.hhint{position:absolute;top:6px;width:30px;height:32px;border-radius:16px;border:1px solid var(--line);background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:20px;line-height:1;color:var(--ink2);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.hhint.show{opacity:1;pointer-events:auto}
.tcbtn{width:46px;height:38px;margin:3px 4px;border-radius:10px;border:1px dashed #B8C4BD;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--ink2)}
.tcbtn b{font-size:16px}.tcbtn small{font-size:9.5px;font-weight:700;margin-top:2px;white-space:nowrap}
.tcbtn.on{border-style:solid;background:var(--closed)}
.cal-head .tc{display:flex;align-items:center;justify-content:center}
@media (max-height:500px){ .cal-head .dh.slim{font-size:11px} .wktoggle{height:28px;font-size:12.5px;padding:0 10px} .hhint{top:2px;height:28px} }

/* ---- incasso v1.4 ---- */
.paysec{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.paysec span{font-weight:500;letter-spacing:0;text-transform:none;font-size:12.5px}
.paycard{padding:2px 14px;margin-bottom:4px}
.payline .pn{font-weight:600}
.payline .rm{width:38px;height:38px;flex:none}
.payline .pl{min-width:0}
.eurin,.unitin{position:relative;display:block;flex:none}
.eurin span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3);font-weight:600;pointer-events:none}
.eurin input{width:110px!important;height:42px;padding-left:28px;text-align:right}
.unitin span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink3);font-weight:600;pointer-events:none}
.unitin input{width:96px!important;height:42px;padding-right:34px;text-align:right}
.payline input{width:auto}
.payempty{padding:14px 0 6px;color:var(--ink3);font-size:14px}
.payadd{padding:8px 0 12px}
.payadd select{height:44px;color:var(--gold-d);font-weight:600}
.payline.use .tsel{height:40px;max-width:320px}
.payline.flash{animation:pflash 1.2s ease}
@keyframes pflash{0%{background:#E4EFE8}100%{background:transparent}}
.stepper.sm{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:12px;height:42px;padding:0 4px;flex:none}
.stepper.sm button{width:32px;height:34px;border:0;background:transparent;font-size:18px;font-weight:600}
.stepper.sm b{min-width:18px;text-align:center}
@media (max-width:760px){ .payline{flex-wrap:wrap} .payline .pl{flex:1 1 100%} .eurin input{width:100px!important} }

/* ---- impostazioni v1.5 ---- */
.set-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.set-row .input.sm{width:96px;flex:none;padding:0 8px}
@media (max-width:899px){ .set-grid{grid-template-columns:1fr!important} }

#ps-calc{display:block!important;padding:10px 14px}

#ps-calc .calcl b{font-size:16px}
#ps-calc .calcl small{color:var(--ink3)}

.unitin.wide input{width:100%!important}
#ca-ok:disabled{opacity:.45}
#ca-body .note-chip{display:block;line-height:1.5}

function layout(list){
  // assign columns for overlapping events
  const res=[]; let cluster=[], end=-1;
  const flush=()=>{ const cols=[]; cluster.forEach(e=>{ let c=cols.findIndex(x=>x<=e.start); if(c<0){c=cols.length;cols.push(0);} cols[c]=e.start+e.dur; e._c=c; }); cluster.forEach(e=>{e._n=cols.length; res.push(e);}); cluster=[]; };
  list.forEach(e=>{ if(e.start>=end && cluster.length) { flush(); end=-1; } cluster.push(e); end=Math.max(end,e.start+e.dur); });
  if(cluster.length) flush();
  return res;
}

function setupHScroll(days){

  for(;m<r[1];m+=15){ if(!busy.some(a=>a.start<m+30 && a.start+a.dur>m)) return m; }

}

function saveDraft(){

  } else { if(!d.title.trim()) d.title='Impegno'; }

    const dt=parse(d.date); const cl=closureOn(d.date);
    openSheet(`<div class="sheet-b" style="text-align:center;padding:28px 24px 10px"><div style="font-size:20px;font-weight:700;margin-bottom:8px">${cl?esc(cl.title)+': salone chiuso':GIORNI[dt.getDay()]+' è un giorno di chiusura'}</div><div class="muted">Vuoi inserire lo stesso questo appuntamento?</div></div>

  if(d.type==='appt'){ Object.assign(base,{clientId:d.clientId,services:d.services,products:d.products||[],note:d.note,payment:d.payment}); } else base.title=d.title;
  if(d.id){ const i=DB.appts.findIndex(a=>a.id===d.id); DB.appts[i]=base; }

}

let pay=null;
function needsTinta(a){ return a && a.services.some(id=>(svc(id).consumes||[]).some(c=>c.pid==='tinta')); }
function guessTinta(c){ const col=(c?.tech?.colore||'').split(/[ +]/)[0]; const t=DB.products.find(p=>p.tinta&&p.tinta===col); return t?t.id:(DB.products.find(p=>p.tinta)?.id||''); }
function openPay(id){
  const a=DB.appts.find(x=>x.id===id);
  pay={apptId:id,items:a.services.map(s=>({label:svc(s).name,price:svc(s).price,kind:'servizio',qty:1})),method:'Contanti',uses:[]};
  (a.products||[]).forEach(x=>{ const p=prod(x.pid); if(p) pay.items.push({label:p.name,price:p.price,kind:'prodotto',productId:p.id,qty:x.qty}); });
  const tg=guessTinta(cli(a.clientId));
  a.services.forEach(sid=>(svc(sid).consumes||[]).forEach(c=>{
    const pid=c.pid==='tinta'?tg:c.pid; if(!pid&&c.pid!=='tinta') return;
    const ex=pay.uses.find(u=>u.pid===pid&&u.unit===c.unit&&!!u.tinta===(c.pid==='tinta'));
    if(ex) ex.qty+=c.qty; else pay.uses.push({pid,qty:c.qty,unit:c.unit,tinta:c.pid==='tinta',from:svc(sid).name});
  }));
  renderPay();
}
function openQuickSale(pid){

const payTotal=()=>pay.items.reduce((s,i)=>s+(+i.price||0)*(i.qty||1),0);

function addSold(pid){ const p=prod(pid); if(!p) return; const ex=pay.items.find(i=>i.productId===pid); if(ex) ex.qty=(ex.qty||1)+1; else pay.items.push({label:p.name,price:p.price,kind:'prodotto',productId:p.id,qty:1}); pay._flash='sold-'+pid; }

function consume(pid,qty,unit){ const p=prod(pid); if(!p||!(qty>0)) return; if(unit==='ml'&&p.size){ p.used=(p.used||0)+qty; while(p.used>=p.size){ p.used-=p.size; p.stock=Math.max(0,p.stock-1); } } else p.stock=Math.max(0,p.stock-qty); }
function confirmPay(){
  if(!pay.items.length){ toast('Niente da incassare'); return; }
  const total=payTotal();
  pay.items.filter(i=>i.productId).forEach(i=>consume(i.productId,i.qty||1,'pz'));
  (pay.uses||[]).forEach(u=>consume(u.pid,u.qty,u.unit));
  if(pay.apptId){
    const a=DB.appts.find(x=>x.id===pay.apptId);
    a.status='paid'; a.payment={items:pay.items,uses:pay.uses,method:pay.method,total};
  }

}

const fmtDate=k=>{ const d=parse(k); return `${d.getDate()} ${MESI[d.getMonth()].slice(0,3)}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''}`; };
function clientStats(id){
  const list=DB.appts.filter(a=>a.clientId===id).sort((a,b)=>(a.date+pad(a.start)).localeCompare(b.date+pad(b.start)));
  const past=list.filter(a=>a.status==='paid');
  const spent=past.reduce((s,a)=>s+a.payment.total,0);
  const future=list.filter(a=>a.status==='booked' && (a.date>TODAY||(a.date===TODAY&&a.start>=nowMin())));
  return {list,past,spent,last:past[past.length-1],first:past[0],next:future[0]};
}
function clientTags(c,st){
  const tags=[]; const days=st.last?Math.round((new Date()-parse(st.last.date))/864e5):999;
  if(st.last && days>56 && !st.next) tags.push(['Da richiamare','warn']);
  if(c.birthday && +c.birthday.slice(0,2)===new Date().getMonth()+1) tags.push(['Compleanno '+(+c.birthday.slice(3))+' '+MESI[new Date().getMonth()].slice(0,3),'bday']);
  if(st.past.length>=12) tags.push(['Abituale','ok']);
  if(st.first && (new Date()-parse(st.first.date))/864e5<=30) tags.push(['Nuova','new']);
  return tags;
}
const tagHTML=t=>`<span class="tag ${t[1]}">${esc(t[0])}</span>`;
function clientFiltered(){
  const q=ui.clientQ.trim().toLowerCase();
  let rows=DB.clients.map(c=>{ const st=clientStats(c.id); return {c,st,tags:clientTags(c,st)}; });
  if(q) rows=rows.filter(r=>r.c.name.toLowerCase().includes(q)||(r.c.phone||'').replace(/\s/g,'').includes(q.replace(/\s/g,'')));
  const F=ui.clientF;
  if(F==='Abituali') rows=rows.filter(r=>r.st.past.length>=12);
  if(F==='Da richiamare') rows=rows.filter(r=>r.tags.some(t=>t[0]==='Da richiamare'));
  if(F==='Compleanni del mese') rows=rows.filter(r=>r.tags.some(t=>t[1]==='bday'));
  if(F==='Nuove') rows=rows.filter(r=>r.tags.some(t=>t[0]==='Nuova'));
  if(ui.clientSort==='rec') rows.sort((a,b)=>(b.st.last?.date||'').localeCompare(a.st.last?.date||'')); else rows.sort((a,b)=>a.c.name.localeCompare(b.c.name));
  return rows;
}

function consAddSheet(){
  const s=DB.services.find(x=>x.id===ui.svcSel);
  const prods=DB.products.filter(p=>p.kind!=='attrezzo');
  const tinte=DB.products.filter(p=>p.tinta);
  const tsize=tinte.find(t=>t.size)?.size||60;
  let st={pid:'',mode:'',qty:'',size:''};
  const draw=()=>{
    const isT=st.pid==='tinta', p=isT?null:prod(st.pid);
    const sz=isT?tsize:(num(st.size)||p?.size||0);
    let body='';
    if(st.pid){
      body+=`<div class="field"><label>Come lo usi</label><div class="seg full" id="ca-mode"><button type="button" data-v="pz" class="${st.mode==='pz'?'on':''}">Un pezzo intero</button><button type="button" data-v="ml" class="${st.mode==='ml'?'on':''}">Solo una parte (ml)</button></div></div>`;
      if(st.mode==='pz') body+=`<div class="field"><label>Quanti pezzi a ogni servizio</label><input class="input" id="ca-q" inputmode="numeric" value="${st.qty||1}"></div>`;
      if(st.mode==='ml'){
        body+=`<div class="row keep"><div class="field"><label>Quanti ml a ogni servizio</label><label class="unitin wide"><input class="input" id="ca-q" inputmode="decimal" value="${st.qty}" placeholder="es. 20"><span>ml</span></label></div>
          <div class="field"><label>${isT?'Un tubo contiene':'Una confezione contiene'}</label><label class="unitin wide"><input class="input" id="ca-sz" inputmode="numeric" value="${sz||''}" placeholder="es. 100" ${isT?'disabled':''}><span>ml</span></label></div></div>`;
        const q=num(st.qty);
        body+= (q&&sz) ? `<div class="note-chip info">Ogni “${esc(s.name)}” scala <b>${q} ml</b>. ${isT?'Un tubo':'Una confezione'} da ${sz} ml basta per circa <b>${Math.floor(sz/q)} servizi</b>, poi il magazzino toglie 1 pezzo.</div>` : `<div class="small muted">Scrivi quanti ml usi più o meno ogni volta: il magazzino tiene il conto e toglie una confezione quando è finita.</div>`;
      }
    }
    $('#ca-body').innerHTML=body;
    $('#ca-body').querySelectorAll('#ca-mode button').forEach(b=>b.onclick=()=>{ st.mode=b.dataset.v; if(st.mode==='pz'&&!st.qty) st.qty=1; if(st.mode==='ml'&&st.qty==1) st.qty=''; draw(); });
    const q=$('#ca-q'); if(q) q.oninput=()=>{ st.qty=q.value; const n=$('#ca-body .note-chip,#ca-body .small'); draw(); const q2=$('#ca-q'); q2.focus(); q2.setSelectionRange(q2.value.length,q2.value.length); };
    const z=$('#ca-sz'); if(z) z.oninput=()=>{ st.size=z.value; draw(); const z2=$('#ca-sz'); z2.focus(); z2.setSelectionRange(z2.value.length,z2.value.length); };
    $('#ca-ok').disabled=!(st.pid&&st.mode&&num(st.qty)>0&&(st.mode!=='ml'||(st.pid==='tinta'||num(st.size)||prod(st.pid)?.size)));
  };
  openSheet(`<div class="sheet-h"><button class="btn ghost sm" data-act="close">Annulla</button><h2>Collega prodotto</h2><button class="btn sm primary" id="ca-ok">Collega</button></div>
   <div class="sheet-b"><div class="small muted" style="margin-bottom:12px">Scegli cosa usi per “${esc(s.name)}”: quando lo incassi, il magazzino si aggiorna da solo.</div>
   <div class="field"><label>1 · Prodotto</label><select class="input" id="ca-p"><option value="">Scegli…</option><option value="tinta">Tinta · il colore lo scegli all'incasso</option>${prods.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.brand)}</option>`).join('')}</select></div>
   <div id="ca-body"></div></div>`,'md');
  $('#ca-p').onchange=e=>{ st.pid=e.target.value; const p=prod(st.pid); st.mode=st.pid==='tinta'?'pz':(p?.size?'ml':''); st.qty=st.mode==='pz'?1:''; st.size=p?.size||''; draw(); };
  $('#ca-ok').onclick=()=>{ if($('#ca-ok').disabled) return; const unit=st.mode, qty=num(st.qty);
    if(unit==='ml'&&st.pid!=='tinta'){ const p=prod(st.pid); p.size=num(st.size)||p.size; p.used=p.used||0; }
    if(unit==='ml'&&st.pid==='tinta'){ tinte.forEach(t=>{ if(!t.size){ t.size=tsize; t.used=t.used||0; } }); }
    s.consumes=s.consumes||[]; s.consumes.push({pid:st.pid,qty,unit}); save(); closeSheet(); renderSvcEdit(); toast('Prodotto collegato'); };
  draw();
}

function renderProdRows(){
  const q=ui.magQ.trim().toLowerCase();
  let list=DB.products.filter(p=>ui.magSec==='Tutto'||p.sec===ui.magSec);
  if(ui.magSec!=='Attrezzature'){
    if(ui.magShow==='In vendita') list=list.filter(p=>p.kind==='vendita');
    if(ui.magShow==='Uso in salone') list=list.filter(p=>p.kind==='interno');
    if(ui.magShow==='Da riordinare') list=list.filter(p=>p.kind!=='attrezzo'&&p.stock<=p.min);
  }
  if(q) list=list.filter(p=>(p.name+' '+p.brand).toLowerCase().includes(q));
  list.sort((a,b)=>SECS.indexOf(a.sec)-SECS.indexOf(b.sec) || (a.kind!=='attrezzo'&&a.stock<=a.min?0:1)-(b.kind!=='attrezzo'&&b.stock<=b.min?0:1) || a.name.localeCompare(b.name));
  const head=`<div class="mgrow hd"><div>Articolo</div><div class="c-sec">Sezione</div><div>Quantità</div><div class="r c-acq">Acquisto</div><div class="r">Vendita</div><div class="r c-mrg">Guadagno</div><div class="r">Usato · Arrivato</div></div>`;
  $('#mgt').innerHTML=head+(list.map(p=>{
    const [f,t]=SECCOL[p.sec]||SECCOL.Capelli;
    const name=`<button class="mname" data-act="p-edit" data-id="${p.id}"><b>${esc(p.name)}</b><span>${esc(p.brand)}</span></button>`;

    if(p.kind==='attrezzo') return `<div class="mgrow">${name}${sec}<div><b>${p.stock}</b> pz</div><div class="r c-acq">${eur(p.cost)}</div><div class="r">${p.status==='In uso'?'<span class="tag ok">In uso</span>':`<span class="tag bday">${esc(p.status||'—')}</span>`}</div><div class="r c-mrg muted">—</div><div class="r"><button class="btn sm ghost" data-act="p-edit" data-id="${p.id}">Dettagli</button></div></div>`;
    const low=p.stock<=p.min; const pct=Math.min(100,p.stock/Math.max(1,p.min*3)*100);
    const mg=margin(p);
    return `<div class="mgrow">${name}${sec}
      <div><div class="sbar"><div class="trk"><div style="width:${pct}%;background:${low?'#C2553B':'var(--gold)'}"></div></div><b class="${low?'low':''}">${p.stock}</b></div><small class="muted">minimo ${p.min}${p.size?` · aperta ${Math.round((p.used||0)/p.size*100)}%`:''}</small></div>
      <div class="r c-acq"><b>${eur2(p.cost)}</b> <small class="muted">+IVA</small><br><small class="muted">${eur2(costIva(p))} ivato</small></div>
      <div class="r">${p.price?`<b>${eur(p.price)}</b><br><small class="muted">IVA incl.</small>`:'<small class="muted">uso salone</small>'}</div>
      <div class="r c-mrg">${mg?`<b style="color:var(--gold-d)">${eur2(mg.m)}</b><br><small class="muted">${mg.label} · ${mg.pct}%</small>`:'<span class="muted">—</span>'}</div>
      <div class="r pm"><button data-act="p-minus" data-id="${p.id}" aria-label="Usato, togli uno">−</button><button data-act="p-plus" data-id="${p.id}" aria-label="Merce arrivata">+</button></div></div>`;
  }).join('')||'<div class="empty">Nessun articolo</div>');
}
function arrivoSheet(id){

function revenueOn(key){
  let s=0,svcT=0,prT=0,cash=0,card=0,n=0;
  DB.appts.forEach(a=>{ if(a.date===key && a.status==='paid'){ n++; s+=a.payment.total; if(a.payment.method==='Contanti') cash+=a.payment.total; else card+=a.payment.total; a.payment.items.forEach(i=>{ const v=(+i.price)*(i.qty||1); if(i.kind==='prodotto') prT+=v; else svcT+=v; }); } });
  DB.sales.forEach(x=>{ if(x.date===key){ s+=x.total; prT+=x.total; if(x.method==='Contanti') cash+=x.total; else card+=x.total; } });
  return {s,svcT,prT,cash,card,n};
}
function rangeRev(from,to){ const t={s:0,svcT:0,prT:0,cash:0,card:0,n:0}; for(let d=new Date(from); d<=to; d=addDays(d,1)){ const r=revenueOn(ymd(d)); for(const k in t) t[k]+=r[k]; } return t; }

  else if(P==='mese'){ from=new Date(d.getFullYear(),d.getMonth(),1); to=new Date(d.getFullYear(),d.getMonth()+1,0); prevFrom=new Date(d.getFullYear(),d.getMonth()-1,1); prevTo=new Date(d.getFullYear(),d.getMonth(),0); for(let x=new Date(from);x<=to;x=addDays(x,1)) buckets.push({l:String(x.getDate()),v:revenueOn(ymd(x)).s,cur:ymd(x)===TODAY,closed:!isOpen(x)}); }
  else { from=new Date(d.getFullYear(),0,1); to=new Date(d.getFullYear(),11,31); prevFrom=new Date(d.getFullYear()-1,0,1); prevTo=new Date(d.getFullYear()-1,11,31); for(let m=0;m<12;m++) buckets.push({l:MESI[m].slice(0,3),v:rangeRev(new Date(d.getFullYear(),m,1),new Date(d.getFullYear(),m+1,0)).s,cur:m===new Date().getMonth()&&d.getFullYear()===new Date().getFullYear()}); }
  const today=new Date(); today.setHours(0,0,0,0);

   <div class="two"><div class="card" style="padding:16px"><div class="sectitle">${P==='anno'?'Mese per mese':'Giorno per giorno'}</div><div class="bchart">${bars}</div></div>

let unlocked=false, lastAct=Date.now();
function showLock(mode='unlock',cb){
  let code='';
  const el=$('#lock'); el.classList.add('show');
  const title=mode==='unlock'?'Inserisci il codice':(mode==='new'?'Nuovo codice (4 cifre)':'Conferma il nuovo codice');
  el.innerHTML=`<div class="lock-box"><div class="lock-logo" role="img" aria-label="Maria Orocorvino Parrucchiere"></div><div class="lock-t">${title}</div><div class="lock-dots" id="ldots">${'<i></i>'.repeat(4)}</div><div class="lock-err" id="lerr">${mode==='unlock'?'PIN di prova: 1234':''}</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div>${mode!=='unlock'?'<button class="btn ghost sm" id="lcancel" style="margin-top:10px">Annulla</button>':''}</div>`;
  const dots=()=>document.querySelectorAll('#ldots i').forEach((d,i)=>d.classList.toggle('on',i<code.length));
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; if(k==='⌫') code=code.slice(0,-1); else if(code.length<4) code+=k; dots();
    if(code.length===4){ if(mode==='unlock'){ if(code===S().pin.code){ el.classList.remove('show'); unlocked=true; lastAct=Date.now(); } else { $('#lerr').textContent='Codice sbagliato, riprova'; el.querySelector('.lock-dots').classList.add('shake'); setTimeout(()=>{ code=''; dots(); el.querySelector('.lock-dots')?.classList.remove('shake'); },400); } } else { const c=code; setTimeout(()=>cb(c),150); } } });
  const lc=$('#lcancel'); if(lc) lc.onclick=()=>el.classList.remove('show');
}
function pinChange(){ showLock('new',c1=>showLock('confirm',c2=>{ if(c1===c2){ S().pin.code=c1; save(); $('#lock').classList.remove('show'); toast('Codice cambiato'); } else { $('#lock').classList.remove('show'); toast('I codici non coincidono'); } })); }
['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true}));

  ({agenda:renderAgenda,clienti:renderClienti,magazzino:renderMagazzino,incassi:renderIncassi,listino:renderListino,impostazioni:renderImpostazioni})[ui.view]();
}

document.addEventListener('click',e=>{
  const sl=e.target.closest('.daycol.slim');
  if(sl){ ui_wk.exp[sl.dataset.day]=true; renderAgenda._keep=true; render(); return; }
  const col=e.target.closest('.daycol');
  if(col && !e.target.closest('.ev')){
    const r=col.getBoundingClientRect(); let m=CAL_FROM+Math.floor((e.clientY-r.top)/K/15)*15;
    m=Math.max(CAL_FROM,Math.min(CAL_TO-15,m)); newDraft(col.dataset.day,m); return;
  }
  if(e.target.id==='overlay'){ closeSheet(); return; }
  const t=e.target.closest('[data-act]'); if(!t) return;
  const A=t.dataset.act, id=t.dataset.id;
  switch(A){
    case 'view': ui.view=t.dataset.v; ui.clientMobileDetail=false; ui.svcMobileEdit=false; ui.sel=null; ui.techEdit=false; renderAgenda._keep=false; render(); $('.main').scrollTop=0; if($('#content')) $('#content').scrollTop=0; break;
    case 'reset': confirmBox('Ripristinare i dati di prova?<div class="small muted" style="font-weight:400;margin-top:6px">Le prove fatte finora verranno cancellate.</div>','Ripristina',()=>{ DB=seed(); save(); closeSheet(); render(); toast('Dati di prova ripristinati'); }); break;
    case 'nav-prev': case 'nav-next': { const s=A==='nav-next'?1:-1; if(isPhone()&&ui.pmode==='month'){ ui.date=new Date(ui.date.getFullYear(),ui.date.getMonth()+s,1); } else if(isPhone()){ ui.date=addDays(ui.date,s); } else if(ui.mode==='week') ui.date=addDays(ui.date,7*s); else { ui.date=addDays(ui.date,s); } renderAgenda._keep=false; render(); break; }
    case 'pmode': ui.pmode=t.dataset.m; renderAgenda._keep=false; render(); break;
    case 'goto-pday': ui.date=parse(t.dataset.d); ui.pmode='day'; renderAgenda._keep=false; render(); break;
    case 'nav-today': ui.date=new Date(); ui.date.setHours(0,0,0,0); renderAgenda._keep=false; render(); break;
    case 'mode': ui.mode=t.dataset.m; renderAgenda._keep=false; render(); break;
    case 'wk-exp': ui_wk.exp[t.dataset.d]=true; renderAgenda._keep=true; render(); break;
    case 'wk-col': e.stopPropagation(); delete ui_wk.exp[t.dataset.d]; renderAgenda._keep=true; render(); break;
    case 'wk-all': ui_wk.all=!ui_wk.all; renderAgenda._keep=true; render(); break;
    case 'wk-sl': case 'wk-sr': { const cb=$('#calbody'); const cw=parseFloat(getComputedStyle($('.cal')).getPropertyValue('--cw'))||100; cb.scrollBy({left:(A==='wk-sr'?1:-1)*cw,behavior:'smooth'}); break; }
    case 'set-wkm': S().wkClosed=t.dataset.m; save(); render(); break;
    case 'sos': openSOS(); break;
    case 'goto-day': ui.date=parse(t.dataset.d); ui.mode='day'; renderAgenda._keep=false; render(); break;
    case 'new-appt': newDraft(); break;
    case 'close': closeSheet(); break;
    case 'd-type': draft.type=t.dataset.t; if(draft.type==='block'&&draft.dur<30) draft.dur=30; renderDraft(); break;
    case 'd-svc': { const i=draft.services.indexOf(id); if(i>=0) draft.services.splice(i,1); else draft.services.push(id); draft.presel=false; draft.dur=Math.max(15,draft.services.reduce((s,x)=>s+svc(x).dur,0)||30); const st=$('#slbody')?.scrollTop; renderDraft(); if(st!=null&&$('#slbody')) $('#slbody').scrollTop=st; break; }
    case 'd-dur': draft.dur=Math.max(15,draft.dur+(+t.dataset.k)); renderDraft(); break;
    case 'd-pick-client': { const keep=draft; clientPicker(cid=>{ draft=keep; setDraftClient(cid); renderDraft(); },()=>{ draft=keep; renderDraft(); }); break; }
    case 'd-add-prod': { const keep=draft; productPicker((keep.products||[]).map(x=>x.pid),ids=>{ draft=keep; const cur=draft.products||[]; draft.products=ids.map(pid=>cur.find(x=>x.pid===pid)||{pid,qty:1}); renderDraft(); },()=>{ draft=keep; renderDraft(); }); break; }
    case 'd-pq': { const i=+t.dataset.i; const x=draft.products[i]; x.qty+= +t.dataset.k; if(x.qty<=0) draft.products.splice(i,1); renderDraft(); break; }
    case 'd-save': saveDraft(); break;
    case 'open-appt': e.stopPropagation(); if(isPhone()||isNarrow()){ openAppt(id); } else { ui.sel=id; renderAgenda._keep=true; renderAgenda(); } break;
    case 'close-detail': ui.sel=null; renderAgenda._keep=true; renderAgenda(); break;
    case 'goto-today': ui.view='agenda'; ui.date=new Date(); ui.date.setHours(0,0,0,0); ui.mode='day'; render(); break;
    case 'new-at': newDraft(t.dataset.d,+t.dataset.m); break;
    case 'edit-appt': editDraft(DB.appts.find(a=>a.id===id)); break;
    case 'del-appt': confirmBox('Eliminare questo appuntamento?','Elimina',()=>{ DB.appts=DB.appts.filter(a=>a.id!==id); save(); closeSheet(); render(); toast('Eliminato'); }); break;
    case 'noshow': { const a=DB.appts.find(x=>x.id===id); a.status='noshow'; save(); closeSheet(); render(); toast('Segnata come non presentata'); break; }
    case 'reopen': { const a=DB.appts.find(x=>x.id===id); if(a.status==='paid') a.payment.items.filter(i=>i.productId).forEach(i=>{const p=prod(i.productId); if(p) p.stock+=(i.qty||1);}); a.status='booked'; delete a.payment; save(); closeSheet(); render(); toast('Stato annullato'); break; }
    case 'pay': e.stopPropagation(); openPay(id); break;
    case 'pay-m': pay.method=t.dataset.m; document.querySelectorAll('.methods button').forEach(b=>b.classList.toggle('on',b.dataset.m===pay.method)); break;
    case 'pay-rm': pay.items.splice(+t.dataset.i,1); renderPay(); break;
    case 'use-rm': pay.uses.splice(+t.dataset.i,1); renderPay(); break;
    case 'pay-q': { const it=pay.items[+t.dataset.i]; it.qty=Math.max(1,(it.qty||1)+(+t.dataset.d)); renderPay(); break; }
    case 'pay-ok': confirmPay(); break;
    case 'quick-sale': openQuickSale(); break;
    /* clienti */
    case 'goto-client': closeSheet(); ui.view='clienti'; ui.client=id; ui.clientMobileDetail=true; ui.techEdit=false; render(); break;
    case 'sel-client': ui.client=id; ui.clientMobileDetail=true; ui.techEdit=false; if(isStack()) renderClienti(); else { renderClientList(); renderClientDetail(); } break;
    case 'cl-back': ui.clientMobileDetail=false; ui.techEdit=false; renderClienti(); break;
    case 'clf': ui.clientF=t.dataset.f; ui.client=null; renderClienti(); break;
    case 'cls': ui.clientSort=t.dataset.s; renderClienti(); break;
    case 'new-client': newClientSheet('',c=>{ closeSheet(); ui.client=c.id; ui.clientMobileDetail=true; render(); }); break;
    case 'book-client': { const c=id; ui.view='agenda'; render(); newDraft(); setDraftClient(c); renderDraft(); break; }
    case 'tech-edit': ui.techEdit=true; renderClientDetail(); break;
    case 'tech-cancel': ui.techEdit=false; renderClientDetail(); break;
    case 'save-tech': { const c=cli(id); c.tech=c.tech||{}; document.querySelectorAll('[data-tech]').forEach(i=>c.tech[i.dataset.tech]=i.value.trim()); c.note=$('#cnote').value; c.phone=$('#cphone').value.trim(); const b=$('#cbday').value.trim().match(/^(\d{1,2})\/(\d{1,2})$/); c.birthday=b?pad(+b[2])+'-'+pad(+b[1]):''; ui.techEdit=false; save(); renderClientList(); renderClientDetail(); toast('Scheda salvata'); break; }
    case 'privacy': { const c=cli(id); c.privacy=c.privacy?'':TODAY; save(); renderClientDetail(); toast(c.privacy?'Consenso registrato':'Consenso tolto'); break; }
    /* listino */
    case 'sel-svc': ui.svcSel=id; ui.svcMobileEdit=true; if(isStack()) renderListino(); else { renderSvcList(); renderSvcEdit(); } break;
    case 'svc-back': ui.svcMobileEdit=false; renderListino(); break;
    case 'new-svc': { const cat=t.dataset.cat||CATS[0].id; const ci=CATS.findIndex(c=>c.id===cat); const p=PALETTE[[0,4,3,6][ci]||0]; const s={id:'s'+uid(),name:'Nuovo servizio',cat,dur:30,posa:0,price:0,...p,active:true,consumes:[]}; DB.services.push(s); save(); ui.svcSel=s.id; ui.svcMobileEdit=true; renderListino(); setTimeout(()=>{ const n=$('#sv-name'); n&&n.select(); },50); break; }
    case 'sv-col': { const s=DB.services.find(x=>x.id===ui.svcSel); Object.assign(s,PALETTE[+t.dataset.i]); save(); renderSvcEdit(); renderSvcList(); break; }
    case 'sv-active': { const s=DB.services.find(x=>x.id===ui.svcSel); s.active=!s.active; save(); renderSvcEdit(); renderSvcList(); break; }
    case 'save-svc': { const s=DB.services.find(x=>x.id===ui.svcSel); s.name=$('#sv-name').value.trim()||s.name; s.cat=$('#sv-cat').value; s.dur=+$('#sv-dur').value; s.posa=+$('#sv-posa').value; s.price=num($('#sv-price').value); save(); renderSvcList(); renderSvcEdit(); toast('Servizio salvato'); break; }
    case 'del-svc': confirmBox('Eliminare “'+esc(svc(id).name)+'” dal listino?<div class="small muted" style="font-weight:400;margin-top:6px">Se l\'hai già usato, meglio spegnere “Attivo”.</div>','Elimina',()=>{ DB.services=DB.services.filter(s=>s.id!==id); ui.svcSel=null; save(); closeSheet(); renderListino(); }); break;
    case 'cons-add': consAddSheet(); break;
    case 'cons-rm': { const s=DB.services.find(x=>x.id===ui.svcSel); s.consumes.splice(+t.dataset.i,1); save(); renderSvcEdit(); break; }
    /* magazzino */
    case 'mag-sec': ui.magSec=t.dataset.s; renderMagazzino(); break;
    case 'mag-show': ui.magShow=t.dataset.s; renderMagazzino(); break;
    case 'p-minus': { const p=prod(id); if(p.stock<=0){ toast('Già a zero'); break; } p.stock--; save(); renderNav(); renderProdRows(); toast(`${p.name}: ${p.stock} rimasti`); break; }
    case 'p-plus': arrivoSheet(id); break;
    case 'p-edit': prodSheet(id); break;
    case 'new-prod': prodSheet(null); break;
    case 'shoplist': shopList(); break;
    /* incassi */
    case 'inc-p': ui.incP=t.dataset.p; render(); break;
    case 'inc-prev': case 'inc-next': { const s=A==='inc-next'?1:-1; const d=ui.incDate; ui.incDate=ui.incP==='giorno'?addDays(d,s):ui.incP==='settimana'?addDays(d,7*s):ui.incP==='mese'?new Date(d.getFullYear(),d.getMonth()+s,1):new Date(d.getFullYear()+s,0,1); render(); break; }
    case 'inc-today': ui.incDate=new Date(); ui.incDate.setHours(0,0,0,0); render(); break;
    case 'day-close': dayCloseSheet(); break;
    case 'day-reopen': delete S().dayClosed[ymd(ui.incDate)]; save(); render(); break;
    /* impostazioni */
    case 'h-open': { const h=S().hours[t.dataset.d]; h.open=!h.open; save(); render(); break; }
    case 'clos-add': closureSheet(); break;
    case 'clos-rm': S().closures=S().closures.filter(c=>c.id!==id); save(); render(); toast('Chiusura tolta'); break;
    case 'pin-on': S().pin.on=!S().pin.on; save(); render(); toast(S().pin.on?'Codice attivo':'Codice disattivato'); break;
    case 'pin-change': pinChange(); break;
    case 'lock-now': unlocked=false; showLock(); break;
    case 'backup-copy': (async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(DB)); toast('Dati copiati'); }catch(err){ toast('Copia non riuscita'); } })(); break;
  }
});
let tx=null,ty=null;
document.addEventListener('touchstart',e=>{ if(!isPhone()||ui.view!=='agenda'||$('#overlay').classList.contains('show')) return; tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchend',e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>70 && Math.abs(dy)<45){ const s=dx<0?1:-1;
    if(ui.pmode==='month') ui.date=new Date(ui.date.getFullYear(),ui.date.getMonth()+s,1);
    else ui.date=addDays(ui.date,s);
    renderAgenda._keep=true; render(); } },{passive:true});
const layoutKey=()=>isPhone()+'/'+isShort()+'/'+isStack();
let lastP=layoutKey();
addEventListener('resize',()=>{ const k=layoutKey(); if(lastP!==k){ lastP=k; if(isShort()) ui.mode='week'; ui.sel=null; renderAgenda._keep=false; render(); } });
setInterval(()=>{ if(ui.view==='agenda' && !$('#overlay').classList.contains('show')){ const st=$('#calbody')?.scrollTop; renderAgenda(); if(st!=null&&$('#calbody')) $('#calbody').scrollTop=st; } },60000);
render();
if(S().pin.on) showLock(); else unlocked=true;

</script>
